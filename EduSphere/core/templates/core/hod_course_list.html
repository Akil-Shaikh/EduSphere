{% extends 'core/base.html' %}

{% block title %}Manage Courses{% endblock %}

{% block content %}
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">Manage Courses</h1>
        <a href="{% url 'core:course_create' %}" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm"><i class="fas fa-plus fa-sm text-white-50"></i> Create New Course</a>
    </div>

    <div class="card shadow mb-4">
        <div class="card-body">
            <div class="list-group">
                {% for course in courses %}
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <span>{{ course.title }} ({{ course.code }})</span>
                        <div>
                            <a href="{% url 'core:course_update' course.pk %}" class="btn btn-sm btn-secondary">Rename</a>
                            <a href="{% url 'core:course_detail' course.pk %}" class="btn btn-sm btn-info">Edit</a>
                            <a href="{% url 'core:course_delete' course.pk %}" class="btn btn-sm btn-danger">Delete</a>
                        </div>
                    </div>
                {% empty %}
                    <div class="list-group-item">No courses found in your department.</div>
                {% endfor %}
            </div>
        </div>
    </div>
{% endblock %}
