{% extends 'core/base.html' %}
{% block title %}Update Student Profile{% endblock %}
{% block content %}
    <h1 class="h3 mb-4 text-gray-800">Update Profile for {{ object.user.username }}</h1>
    <div class="card shadow mb-4">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Save Changes</button>
                <a href="{% url 'core:student_list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
